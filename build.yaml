---
include:
  - board: eyelash_nano
    shield: eyelash_corne_left nice_epaper
    snippet: studio-rpc-usb-uart zmk-usb-logging
    cmake-args: >-
      -DCONFIG_ZMK_STUDIO=y
      -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
      -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
    artifact-name: eyelash_corne_studio_left
  - board: eyelash_nano
    shield: eyelash_corne_right nice_epaper
    cmake-args: -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
  - board: eyelash_nano
    shield: settings_reset
  # DEBUG ONLY: bisection build to isolate the "keyboard unresponsive" issue.
  # No display, no Studio, no runtime macro/combo - just kscan + keymap + logging.
  - board: eyelash_nano
    shield: eyelash_corne_left
    snippet: zmk-usb-logging
    cmake-args: >-
      -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=1000
      -DCONFIG_ZMK_RUNTIME_MACRO=n
      -DCONFIG_ZMK_RUNTIME_COMBO=n
      -DCONFIG_ZMK_STUDIO=n
    artifact-name: eyelash_corne_debug_bare_left
  # DEBUG ONLY: bare + display, still no Studio/macro/combo, to confirm
  # whether nice_epaper alone is what crashes the board.
  - board: eyelash_nano
    shield: eyelash_corne_left nice_epaper
    snippet: zmk-usb-logging
    cmake-args: >-
      -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=1000
      -DCONFIG_ZMK_RUNTIME_MACRO=n
      -DCONFIG_ZMK_RUNTIME_COMBO=n
      -DCONFIG_ZMK_STUDIO=n
      -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
    artifact-name: eyelash_corne_debug_display_left
